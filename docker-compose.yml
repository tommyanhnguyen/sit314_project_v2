x-service-environment: &service-environment
  MQTT_URL: mqtt://broker:1883
  MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/shelfsense}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  broker:
    build: .
    command: node src/broker.js
    restart: unless-stopped
    environment:
      MQTT_PORT: 1883
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(1883,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  node-red:
    image: nodered/node-red:4.0.9
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
    ports:
      - "1880:1880"
    volumes:
      - ./node-red/settings.js:/data/settings.js:ro
      - ./node-red/flows.json:/data/flows.json
      - ./src/edge:/data/edge:ro
      - ./src/shared:/data/shared:ro

  inventory:
    build: .
    command: node src/service-runner.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: inventory

  replenishment:
    build: .
    command: node src/service-runner.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: replenishment

  cold-chain:
    build: .
    command: node src/service-runner.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: cold-chain

  delivery:
    build: .
    command: node src/service-runner.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: delivery

  dead-letter:
    build: .
    command: node src/service-runner.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      SERVICE_NAME: dead-letter

  api:
    build: .
    command: node src/api/server.js
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      <<: *service-environment
      PORT: 3000
    ports:
      - "3000:3000"

  simulator:
    build: .
    command: node src/simulator.js
    profiles: ["demo"]
    depends_on:
      node-red:
        condition: service_started
    environment:
      MQTT_URL: mqtt://broker:1883
      STORES: 2
      STARTUP_DELAY_MS: 8000

volumes:
  mongo-data:
