name: Deploy ShelfSense to AWS
on:
  workflow_dispatch:
    inputs:
      inventory_max_tasks:
        description: '1 for fixed baseline, 4 for auto scaling run'
        required: true
        default: '4'
        type: choice
        options: ['1', '4']
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      VPC_ID: ${{ vars.VPC_ID }}
      PUBLIC_SUBNET_A: ${{ vars.PUBLIC_SUBNET_A }}
      PUBLIC_SUBNET_B: ${{ vars.PUBLIC_SUBNET_B }}
      PRIVATE_SUBNET_A: ${{ vars.PRIVATE_SUBNET_A }}
      PRIVATE_SUBNET_B: ${{ vars.PRIVATE_SUBNET_B }}
      API_CERTIFICATE_ARN: ${{ vars.API_CERTIFICATE_ARN }}
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      MONGO_SECRET_ARN: ${{ vars.MONGO_SECRET_ARN }}
      SIGNING_SECRET_ARN: ${{ vars.SIGNING_SECRET_ARN }}
      API_AUTH_SECRET_ARN: ${{ vars.API_AUTH_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check-ci
      - run: npm run security-check
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          registry="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          tag="${GITHUB_SHA:0:12}"
          docker build -t "${ECR_REPOSITORY_URI}:${tag}" .
          docker push "${ECR_REPOSITORY_URI}:${tag}"
          digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY_URI#*/}" --image-ids "imageTag=${tag}" --query 'imageDetails[0].imageDigest' --output text)"
          echo "uri=${ECR_REPOSITORY_URI}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Validate and deploy stack
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          INVENTORY_MAX_TASKS: ${{ inputs.inventory_max_tasks }}
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://infra/aws/template.json
          aws cloudformation deploy \
            --template-file infra/aws/template.json \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "ImageUri=$IMAGE_URI" "VpcId=$VPC_ID" \
              "PublicSubnetA=$PUBLIC_SUBNET_A" "PublicSubnetB=$PUBLIC_SUBNET_B" \
              "PrivateSubnetA=$PRIVATE_SUBNET_A" "PrivateSubnetB=$PRIVATE_SUBNET_B" \
              "ApiCertificateArn=$API_CERTIFICATE_ARN" \
              "ApiDomainName=$API_DOMAIN_NAME" "HostedZoneId=$HOSTED_ZONE_ID" \
              "MongoSecretArn=$MONGO_SECRET_ARN" \
              "SigningSecretArn=$SIGNING_SECRET_ARN" \
              "ApiAuthSecretArn=$API_AUTH_SECRET_ARN" \
              "InventoryMaxTasks=$INVENTORY_MAX_TASKS"
      - name: Publish portal to private S3 and refresh CloudFront
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='PortalBucketName'].OutputValue | [0]" --output text)"
          distribution="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='PortalDistributionId'].OutputValue | [0]" --output text)"
          test -n "$bucket" && test -n "$distribution"
          aws s3 sync public/ "s3://$bucket" --delete
          invalidation="$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$distribution" --id "$invalidation"
